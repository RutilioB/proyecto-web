<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Costa Azul Oceanfront Hotel</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Costa Azul Oceanfront Hotel - Tu paraíso frente al mar en El Salvador">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#0EA5E9',
            secondary: '#0284C7',
            accent: '#F59E0B'
          },
          animation: {
            'slow-zoom': 'slowZoom 20s ease-in-out infinite',
            'pulse-slow': 'pulseSlow 4s ease-in-out infinite',
            'fade-in': 'fadeIn 1s ease-in',
            'fade-in-down': 'fadeInDown 1s ease-in',
            'fade-in-up': 'fadeInUp 1s ease-in',
            'fade-in-up-delay': 'fadeInUp 1s ease-in 0.3s both',
            'wave': 'wave 8s ease-in-out infinite',
            'wave-slow': 'wave 12s ease-in-out infinite'
          },
          keyframes: {
            slowZoom: {
              '0%, 100%': { transform: 'scale(1)' },
              '50%': { transform: 'scale(1.1)' }
            },
            pulseSlow: {
              '0%, 100%': { opacity: '0.4' },
              '50%': { opacity: '0.6' }
            },
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' }
            },
            fadeInDown: {
              '0%': { opacity: '0', transform: 'translateY(-20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' }
            },
            fadeInUp: {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' }
            },
            wave: {
              '0%': { transform: 'translateX(0)' },
              '50%': { transform: 'translateX(-25%)' },
              '100%': { transform: 'translateX(0)' }
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50">
  <app-root></app-root>
</body>
</html>
