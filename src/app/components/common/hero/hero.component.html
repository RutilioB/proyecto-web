<section class="relative h-[600px] flex items-center justify-center overflow-hidden">
  
  
  <div class="absolute inset-0">
    <img [src]="imageUrl" [alt]="title" class="w-full h-full object-cover animate-slow-zoom">
    <div class="absolute inset-0 bg-gradient-to-r from-black/70 to-black/40 animate-pulse-slow"></div>
  </div>

  
  <div class="relative z-10 max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
    
    
    <p *ngIf="subtitle" class="text-accent text-lg font-semibold mb-4 animate-fade-in-down">
      {{ subtitle }}
    </p>
    
    
    <h1 class="text-white text-4xl sm:text-5xl lg:text-6xl font-bold mb-6 leading-tight animate-fade-in">
      {{ title }}
    </h1>
    
    
    <p *ngIf="description" class="text-gray-200 text-lg sm:text-xl mb-8 max-w-2xl mx-auto animate-fade-in-up">
      {{ description }}
    </p>
    
    
    <div class="flex flex-col sm:flex-row gap-4 justify-center items-center animate-fade-in-up-delay">
      <button 
        *ngIf="primaryButtonText" 
        class="bg-primary text-white px-8 py-3 rounded-full font-semibold hover:bg-secondary transition-all transform hover:scale-105 shadow-lg w-full sm:w-auto"
        (click)="onPrimaryButtonClick()">
        {{ primaryButtonText }}
      </button>
      
      <button 
        *ngIf="secondaryButtonText" 
        class="bg-white text-gray-900 px-8 py-3 rounded-full font-semibold hover:bg-gray-100 transition-all transform hover:scale-105 shadow-lg w-full sm:w-auto"
        (click)="onSecondaryButtonClick()">
        {{ secondaryButtonText }}
      </button>
    </div>

  </div>

  
  <div class="absolute bottom-0 left-0 right-0 h-32 opacity-20">
    <svg class="absolute bottom-0 w-full h-full animate-wave" viewBox="0 0 1440 320" preserveAspectRatio="none">
      <path fill="#0EA5E9" fill-opacity="0.3" d="M0,96L48,112C96,128,192,160,288,160C384,160,480,128,576,112C672,96,768,96,864,112C960,128,1056,160,1152,160C1248,160,1344,128,1392,112L1440,96L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
    </svg>
    <svg class="absolute bottom-0 w-full h-full animate-wave-slow" viewBox="0 0 1440 320" preserveAspectRatio="none">
      <path fill="#0EA5E9" fill-opacity="0.2" d="M0,192L48,176C96,160,192,128,288,133.3C384,139,480,181,576,186.7C672,192,768,160,864,154.7C960,149,1056,171,1152,170.7C1248,171,1344,149,1392,138.7L1440,128L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
    </svg>
  </div>

</section>
