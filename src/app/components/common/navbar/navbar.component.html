<nav class="bg-white shadow-lg sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-20">
      
      
      <div class="flex-shrink-0">
        <a routerLink="/" class="flex items-center">
          <span class="text-2xl font-bold text-primary">Costa Azul</span>
          <span class="text-xl text-gray-600 ml-2 hidden sm:inline">Oceanfront Hotel</span>
        </a>
      </div>

      
      <button 
        (click)="toggleMobileMenu()" 
        class="md:hidden inline-flex items-center justify-center p-2 rounded-md text-gray-700 hover:text-primary hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-primary">
        <span class="text-2xl">☰</span>
      </button>

      
      <div class="hidden md:flex md:items-center md:space-x-1">
        <a 
          *ngFor="let item of menuItems"
          [routerLink]="item.route" 
          routerLinkActive="text-primary border-b-2 border-primary"
          [routerLinkActiveOptions]="{exact: item.route === '/'}"
          class="px-3 py-2 text-sm font-medium text-gray-700 hover:text-primary hover:bg-gray-50 rounded-md transition-colors">
          {{ item.label }}
        </a>
      </div>

      
      <div class="hidden md:block">
        <button 
          (click)="onReservarClick()"
          class="bg-primary text-white px-6 py-2.5 rounded-full font-semibold hover:bg-secondary transition-all transform hover:scale-105 shadow-md">
          Reservar ahora
        </button>
      </div>

    </div>
  </div>

  
  <div [class.hidden]="!mobileMenuOpen" class="md:hidden border-t border-gray-200 bg-white">
    <div class="px-2 pt-2 pb-3 space-y-1">
      <a 
        *ngFor="let item of menuItems"
        [routerLink]="item.route" 
        routerLinkActive="bg-primary text-white"
        [routerLinkActiveOptions]="{exact: item.route === '/'}"
        (click)="toggleMobileMenu()"
        class="block px-4 py-3 text-base font-medium text-gray-700 hover:bg-gray-100 rounded-md">
        {{ item.label }}
      </a>
      <button 
        (click)="onReservarClick()"
        class="w-full mt-2 bg-primary text-white px-4 py-3 rounded-md font-semibold hover:bg-secondary">
        Reservar ahora
      </button>
    </div>
  </div>
</nav>
